<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Awas Batu - Penghindar Meteor</title>

  <!-- menghubungkan html ke css nya -->
  <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
  <header>
    <div>
      <h1>AWAS BATU: PENGHINDAR METEOR</h1>
      <p>Layar Permainan sebagai Jendela Clipping (Cohen-Sutherland &amp; Matriks 3x3)</p>
    </div>
    <div class="hud-stats">
      <span class="stat-score" id="uiScore">SKOR: 0</span>
      <span class="stat-level" id="uiLevel">WAVE: 1</span>
      <span class="stat-hp" id="uiHp">PERISAI: 100%</span>
    </div>
  </header>

  <div class="canvas-container">
    <canvas id="gameCanvas" width="900" height="600"></canvas>
  </div>

  <!-- Kontrol Virtual untuk Smartphone / Layar Sentuh -->
  <div class="mobile-controls" id="mobileControls">
    <div class="dpad-container" id="dpadContainer">
      <button type="button" class="ctrl-btn ctrl-dir ctrl-up" id="btnUp" aria-label="Atas">▲</button>
      <button type="button" class="ctrl-btn ctrl-dir ctrl-left" id="btnLeft" aria-label="Kiri">◀</button>
      <div class="dpad-center"></div>
      <button type="button" class="ctrl-btn ctrl-dir ctrl-right" id="btnRight" aria-label="Kanan">▶</button>
      <button type="button" class="ctrl-btn ctrl-dir ctrl-down" id="btnDown" aria-label="Bawah">▼</button>
    </div>
    <div class="action-container">
      <button type="button" class="ctrl-btn ctrl-boost" id="btnBoost" aria-label="Boost Perisai">
        <span class="boost-icon">🛡️</span>
        <span class="boost-title">BOOST</span>
        <span class="boost-sub">PERISAI</span>
      </button>
    </div>
  </div>

  <div class="footer-info">
    <div>
      Kontrol: <kbd>A</kbd>/<kbd>D</kbd> atau <kbd>←</kbd>/<kbd>→</kbd> Gerak | <kbd>W</kbd>/<kbd>S</kbd> atau <kbd>↑</kbd>/<kbd>↓</kbd> Maju/Mundur | <kbd>SPASI</kbd> Boost Perisai
    </div>
    <div class="footer-actions">
      <label class="upload-label" for="meteorImageInput">
        🖼️ Ganti Gambar Meteor
      </label>
      <input type="file" id="meteorImageInput" accept="image/*" />
      <button id="btnResetMeteorImg" type="button">Reset Meteor Bro</button>
      <button id="btnRestart" type="button">Main Lagi Bro</button>
    </div>
  </div>

  <!-- menghubungkan html ke js -->
  <script src="script.js"></script>
</body>
</html>
